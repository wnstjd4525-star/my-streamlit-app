[theme]
base = "light"
primaryColor = "#202020"
font = "sans serif"

[theme.light]
primaryColor = "#202020"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"
borderColor = "#A3A3A3"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"

[theme.dark]
primaryColor = "#EDEDED"
backgroundColor = "#0C0C0C"
secondaryBackgroundColor = "#191919"
textColor = "#F5F5F5"
borderColor = "#737373"

[theme.dark.sidebar]
backgroundColor = "#0C0C0C"
secondaryBackgroundColor = "#191919"
textColor = "#F5F5F5"
